<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NeonCity - GTA Inspired Web Game</title>
  <style>
    :root {
      --bg: #0a0e27;
      --panel: rgba(10, 14, 39, 0.85);
      --cyan: #00d4ff;
      --pink: #ff006e;
      --yellow: #ffd166;
      --green: #00ff88;
      --white: #ecf0f1;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--white);
      font-family: Arial, Helvetica, sans-serif;
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle at center, #0d1530 0%, var(--bg) 60%, #050912 100%);
    }

    #hud {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 12px;
      pointer-events: none;
      font-family: 'Courier New', monospace;
    }

    #title {
      font-size: 30px;
      font-weight: 900;
      letter-spacing: 2px;
      color: var(--pink);
      text-shadow: 0 0 30px rgba(255, 0, 110, 0.9), 0 0 60px rgba(0, 212, 255, 0.6);
      text-transform: uppercase;
    }

    #stats {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 12px 16px;
      background: var(--panel);
      border: 2px solid var(--cyan);
      border-radius: 5px;
      backdrop-filter: blur(10px);
      box-shadow: 0 0 20px rgba(0, 212, 255, 0.3);
      min-width: 200px;
    }

    #stats span {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      letter-spacing: 1px;
      color: var(--cyan);
      font-weight: 700;
    }

    .bar {
      width: 150px;
      height: 8px;
      background: rgba(0,0,0,0.5);
      border: 1px solid rgba(0, 212, 255, 0.4);
      border-radius: 3px;
      overflow: hidden;
    }

    .fill {
      height: 100%;
      transition: width 0.12s ease;
    }

    #healthFill {
      width: 100%;
      background: linear-gradient(90deg, var(--green), var(--cyan));
    }

    #wantedFill {
      width: 0%;
      background: linear-gradient(90deg, var(--pink), var(--yellow));
    }

    #controls {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 10px 14px;
      background: rgba(10, 14, 39, 0.8);
      border: 2px solid var(--pink);
      border-radius: 5px;
      font-size: 11px;
      color: var(--pink);
      letter-spacing: 0.5px;
    }

    #controls span { display: block; }

    #crosshair {
      position: fixed;
      left: 50%;
      top: 50%;
      width: 20px;
      height: 20px;
      transform: translate(-50%, -50%);
      pointer-events: none;
      opacity: 0.95;
      z-index: 9;
    }

    #crosshair::before,
    #crosshair::after {
      content: "";
      position: absolute;
      background: rgba(0, 255, 136, 0.9);
      box-shadow: 0 0 8px rgba(0, 255, 136, 0.85);
    }

    #crosshair::before {
      left: 50%;
      top: 0;
      width: 2px;
      height: 100%;
      transform: translateX(-50%);
    }

    #crosshair::after {
      left: 0;
      top: 50%;
      width: 100%;
      height: 2px;
      transform: translateY(-50%);
    }

    #settingsPanel {
      position: fixed;
      right: 20px;
      bottom: 20px;
      width: 220px;
      padding: 14px 16px;
      border-radius: 10px;
      background: rgba(10, 14, 39, 0.9);
      border: 2px solid var(--cyan);
      box-shadow: 0 0 20px rgba(0, 212, 255, 0.3);
      z-index: 10;
    }

    #settingsPanel h3 {
      margin: 0 0 12px 0;
      color: var(--pink);
      font-size: 14px;
      letter-spacing: 1px;
      text-transform: uppercase;
      font-family: 'Courier New', monospace;
    }

    .setting {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 10px 0;
      font-size: 12px;
      color: var(--cyan);
      font-family: 'Courier New', monospace;
    }

    .setting select,
    .setting input {
      accent-color: var(--pink);
      cursor: pointer;
    }

    #touchControls {
      position: fixed;
      left: 20px;
      bottom: 20px;
      z-index: 11;
      display: none;
      flex-direction: column;
      gap: 10px;
    }

    @media (max-width: 860px) {
      #touchControls { display: flex; }
      #settingsPanel { display: none; }
    }

    .touchPad {
      display: flex;
      gap: 8px;
    }

    .touchBtn {
      width: 56px;
      height: 56px;
      border-radius: 8px;
      background: rgba(0, 212, 255, 0.18);
      border: 2px solid var(--cyan);
      color: var(--cyan);
      font-size: 20px;
      font-weight: 700;
      cursor: pointer;
      user-select: none;
    }

    .touchBtn.fire {
      width: 120px;
      background: rgba(255, 0, 110, 0.18);
      border-color: var(--pink);
      color: var(--pink);
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div id="hud">
    <div id="title">NEONCITY</div>
    <div id="stats">
      <span>HEALTH <span id="healthLabel">100</span></span>
      <div class="bar"><div id="healthFill" class="fill"></div></div>
      <span>WANTED <span id="wantedLabel">0</span></span>
      <div class="bar"><div id="wantedFill" class="fill"></div></div>
      <span>SPEED <span id="speedLabel">0</span> KM/H</span>
    </div>
    <div id="controls">
      <span>WASD / ARROWS = DRIVE</span>
      <span>SPACE = BRAKE</span>
      <span>CLICK / F = SHOOT</span>
      <span>P = WANTED LEVEL</span>
      <span>M = SWITCH MAP</span>
    </div>
  </div>

  <div id="crosshair"></div>

  <div id="settingsPanel">
    <h3>Settings</h3>
    <div class="setting">
      <label for="quality">Graphics</label>
      <select id="quality">
        <option value="low">Low</option>
        <option value="medium" selected>Medium</option>
        <option value="high">High</option>
      </select>
    </div>
    <div class="setting">
      <label for="soundToggle">Sound</label>
      <input id="soundToggle" type="checkbox" checked />
    </div>
  </div>

  <div id="touchControls">
    <div class="touchPad">
      <button class="touchBtn" data-action="left">◀</button>
      <button class="touchBtn" data-action="right">▶</button>
    </div>
    <div class="touchPad">
      <button class="touchBtn" data-action="accelerate">▲</button>
      <button class="touchBtn" data-action="brake">▼</button>
    </div>
    <div class="touchPad">
      <button class="touchBtn fire" data-action="fire">FIRE</button>
    </div>
  </div>

  <script>
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');
    document.body.appendChild(canvas);

    const state = {
      width: window.innerWidth,
      height: window.innerHeight,
      mapIndex: 0,
      health: 100,
      wanted: 0,
      speed: 0,
      angle: 0,
      x: 0,
      z: 0,
      keys: {},
      lastTime: 0,
      bullets: [],
      enemies: [],
      vehicles: [],
      fireCooldown: 0,
      gamepad: null,
      soundEnabled: true,
      quality: 'medium'
    };

    const cityMaps = [
      {
        name: 'Downtown Grid',
        buildings: [
          { x: -90, y: -90, w: 20, h: 60, c: '#ff006e' },
          { x: 40, y: -80, w: 22, h: 55, c: '#00d4ff' },
          { x: -70, y: 50, w: 18, h: 75, c: '#ffd166' },
          { x: 80, y: 70, w: 26, h: 80, c: '#00ff88' },
          { x: 0, y: 110, w: 24, h: 65, c: '#9b5de5' },
          { x: -120, y: 10, w: 18, h: 50, c: '#45aaf2' },
          { x: 120, y: -30, w: 20, h: 80, c: '#ff7f50' },
          { x: -30, y: -140, w: 28, h: 60, c: '#3ecf8e' },
          { x: 100, y: -120, w: 22, h: 70, c: '#f72585' }
        ]
      },
      {
        name: 'Neon District',
        buildings: [
          { x: 0, y: 0, w: 24, h: 50, c: '#00d4ff' },
          { x: -80, y: -40, w: 25, h: 70, c: '#ff006e' },
          { x: 90, y: -60, w: 18, h: 60, c: '#00ff88' },
          { x: 70, y: 85, w: 30, h: 90, c: '#ffd166' },
          { x: -100, y: 90, w: 24, h: 80, c: '#9b5de5' },
          { x: 10, y: 140, w: 22, h: 65, c: '#45aaf2' },
          { x: -150, y: 0, w: 20, h: 50, c: '#ff7f50' },
          { x: 150, y: 30, w: 20, h: 70, c: '#3ecf8e' }
        ]
      }
    ];

    function initMap() {
      const map = cityMaps[state.mapIndex];
      state.enemies = [];
      state.vehicles = [];

      for (let i = 0; i < 6; i++) {
        state.enemies.push({
          x: (Math.random() - 0.5) * 180,
          y: (Math.random() - 0.5) * 180,
          vx: (Math.random() - 0.5) * 1.2,
          vy: (Math.random() - 0.5) * 1.2,
          color: i % 2 === 0 ? '#ff006e' : '#00d4ff',
          size: 10 + Math.random() * 6
        });
      }

      for (let i = 0; i < 4; i++) {
        state.vehicles.push({
          x: (Math.random() - 0.5) * 180,
          y: (Math.random() - 0.5) * 180,
          w: 18,
          h: 30,
          c: ['#00ff88', '#ffd166', '#ff006e', '#00d4ff'][i % 4]
        });
      }
    }

    function resize() {
      state.width = window.innerWidth;
      state.height = window.innerHeight;
      canvas.width = state.width;
      canvas.height = state.height;
      ctx.setTransform(1, 0, 0, 1, 0, 0);
    }

    function clamp(value, min, max) {
      return Math.min(Math.max(value, min), max);
    }

    function getGamepad() {
      const pads = navigator.getGamepads ? navigator.getGamepads() : [];
      return Array.from(pads).find(p => p && p.connected) || null;
    }

    function rumble(strength = 0.4, duration = 60) {
      const pad = getGamepad();
      if (!pad || !pad.vibrationActuator) return;
      try {
        pad.vibrationActuator.playEffect('dual-rumble', {
          startDelay: 0,
          duration,
          weakMagnitude: clamp(strength * 0.5, 0, 1),
          strongMagnitude: clamp(strength, 0, 1)
        });
      } catch (e) {}
    }

    function shootBullet() {
      if (state.fireCooldown > 0) return;
      const angle = state.angle;
      state.bullets.push({
        x: state.x + Math.cos(angle) * 18,
        y: state.z + Math.sin(angle) * 18,
        vx: Math.cos(angle) * 9,
        vy: Math.sin(angle) * 9,
        life: 80
      });
      state.fireCooldown = 120;
      rumble(0.5, 40);
    }

    function updatePlayer(dt) {
      const pad = getGamepad();

      let steer = 0;
      if (state.keys['ArrowLeft'] || state.keys['KeyA']) steer -= 1;
      if (state.keys['ArrowRight'] || state.keys['KeyD']) steer += 1;
      if (pad) {
        steer += pad.axes[0] || 0;
      }

      let throttle = 0;
      if (state.keys['ArrowUp'] || state.keys['KeyW']) throttle += 1;
      if (state.keys['ArrowDown'] || state.keys['KeyS']) throttle -= 1;
      if (pad) {
        throttle += (pad.axes[1] || 0) * -1;
      }

      const brake = state.keys['Space'] || (pad && (pad.buttons[6]?.pressed || pad.buttons[0]?.pressed));

      state.angle += steer * 2.2 * dt;

      if (brake) {
        state.speed *= 0.88;
      } else {
        state.speed += throttle * 0.65 * dt;
      }

      state.speed *= 0.985;
      state.speed = clamp(state.speed, -10, 30);

      state.x += Math.cos(state.angle) * state.speed * dt * 25;
      state.z += Math.sin(state.angle) * state.speed * dt * 25;

      state.x = clamp(state.x, -200, 200);
      state.z = clamp(state.z, -200, 200);

      if (state.fireCooldown > 0) state.fireCooldown -= dt * 60;

      if (Math.abs(state.speed) > 15) {
        rumble(Math.min(1, Math.abs(state.speed) / 28), 30);
      }
    }

    function updateBullets(dt) {
      for (let i = state.bullets.length - 1; i >= 0; i--) {
        const b = state.bullets[i];
        b.x += b.vx * dt * 60;
        b.y += b.vy * dt * 60;
        b.life -= dt * 60;
        if (b.life <= 0) {
          state.bullets.splice(i, 1);
          continue;
        }

        for (let e = state.enemies.length - 1; e >= 0; e--) {
          const enemy = state.enemies[e];
          const dx = enemy.x - b.x;
          const dy = enemy.y - b.y;
          const distance = Math.hypot(dx, dy);
          if (distance < enemy.size + 4) {
            state.enemies.splice(e, 1);
            state.bullets.splice(i, 1);
            state.wanted = clamp(state.wanted + 1, 0, 5);
            break;
          }
        }
      }
    }

    function updateEnemies(dt) {
      for (const enemy of state.enemies) {
        const dx = state.x - enemy.x;
        const dy = state.z - enemy.y;
        const dist = Math.hypot(dx, dy) || 1;
        if (dist < 200) {
          enemy.x += (dx / dist) * 0.5 * dt * 60;
          enemy.y += (dy / dist) * 0.5 * dt * 60;
        }
      }
    }

    function updateHUD() {
      document.getElementById('healthLabel').textContent = Math.round(state.health);
      document.getElementById('wantedLabel').textContent = state.wanted;
      document.getElementById('speedLabel').textContent = Math.round(Math.abs(state.speed) * 8);
      document.getElementById('healthFill').style.width = state.health + '%';
      document.getElementById('wantedFill').style.width = (state.wanted / 5) * 100 + '%';
    }

    function drawRoads() {
      ctx.save();
      ctx.translate(state.width / 2, state.height / 2);

      const scale = 1.8;
      const ox = -state.x * scale;
      const oy = -state.z * scale;

      ctx.translate(ox, oy);

      ctx.strokeStyle = 'rgba(255,255,255,0.2)';
      ctx.lineWidth = 4;
      for (let i = -200; i <= 200; i += 40) {
        ctx.beginPath();
        ctx.moveTo(-200, i);
        ctx.lineTo(200, i);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(i, -200);
        ctx.lineTo(i, 200);
        ctx.stroke();
      }

      ctx.strokeStyle = '#444';
      ctx.lineWidth = 18;
      ctx.strokeRect(-200, -200, 400, 400);

      ctx.strokeStyle = '#ffeb3b';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(-200, 0); ctx.lineTo(200, 0); ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(0, -200); ctx.lineTo(0, 200); ctx.stroke();

      ctx.restore();
    }

    function drawBuildings() {
      const map = cityMaps[state.mapIndex];
      ctx.save();
      ctx.translate(state.width / 2, state.height / 2);
      const scale = 1.8;
      ctx.translate(-state.x * scale, -state.z * scale);

      for (const b of map.buildings) {
        const x = b.x;
        const y = b.y;
        const w = b.w;
        const h = b.h;

        ctx.fillStyle = b.c;
        ctx.shadowColor = b.c;
        ctx.shadowBlur = 15;
        ctx.fillRect(x - w / 2, y - h / 2, w, h);

        ctx.fillStyle = 'rgba(255,255,255,0.2)';
        for (let yy = y - h / 2 + 8; yy < y + h / 2; yy += 12) {
          ctx.fillRect(x - w / 2 + 4, yy, w - 8, 4);
        }
      }

      ctx.restore();
    }

    function drawPlayer() {
      const px = state.width / 2;
      const py = state.height / 2;
      const size = 18;
      ctx.save();
      ctx.translate(px, py);
      ctx.rotate(state.angle);

      ctx.fillStyle = '#00ff88';
      ctx.shadowBlur = 15;
      ctx.shadowColor = '#00ff88';
      ctx.fillRect(-12, -22, 24, 44);

      ctx.fillStyle = '#1a1a2e';
      ctx.fillRect(-8, -10, 16, 18);

      ctx.fillStyle = '#fff';
      ctx.fillRect(-5, 20, 4, 12);
      ctx.fillRect(1, 20, 4, 12);

      ctx.restore();
    }

    function drawEnemies() {
      for (const e of state.enemies) {
        const screenX = state.width / 2 + (e.x - state.x) * 1.8;
        const screenY = state.height / 2 + (e.y - state.z) * 1.8;
        ctx.fillStyle = e.color;
        ctx.shadowColor = e.color;
        ctx.shadowBlur = 12;
        ctx.beginPath();
        ctx.arc(screenX, screenY, e.size, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function drawVehicles() {
      for (const v of state.vehicles) {
        const screenX = state.width / 2 + (v.x - state.x) * 1.8;
        const screenY = state.height / 2 + (v.y - state.z) * 1.8;
        ctx.fillStyle = v.c;
        ctx.shadowColor = v.c;
        ctx.shadowBlur = 15;
        ctx.fillRect(screenX - v.w / 2, screenY - v.h / 2, v.w, v.h);
      }
    }

    function drawBullets() {
      for (const b of state.bullets) {
        const screenX = state.width / 2 + (b.x - state.x) * 1.8;
        const screenY = state.height / 2 + (b.y - state.z) * 1.8;
        ctx.fillStyle = '#ffd166';
        ctx.shadowColor = '#ffd166';
        ctx.shadowBlur = 10;
        ctx.beginPath();
        ctx.arc(screenX, screenY, 4, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function drawMiniMap() {
      const mapX = state.width - 140;
      const mapY = state.height - 140;
      const size = 110;
      ctx.fillStyle = 'rgba(10, 14, 39, 0.8)';
      ctx.fillRect(mapX, mapY, size, size);
      ctx.strokeStyle = '#00d4ff';
      ctx.strokeRect(mapX, mapY, size, size);

      const sx = size / 400;
      ctx.fillStyle = '#ff006e';
      ctx.fillRect(mapX + (state.x + 200) * sx, mapY + (state.z + 200) * sx, 6, 6);

      for (const e of state.enemies) {
        ctx.fillStyle = '#00d4ff';
        ctx.fillRect(mapX + (e.x + 200) * sx, mapY + (e.y + 200) * sx, 4, 4);
      }
    }

    function render() {
      ctx.clearRect(0, 0, state.width, state.height);
      ctx.fillStyle = 'rgba(11,17,32,0.35)';
      ctx.fillRect(0, 0, state.width, state.height);

      drawBuildings();
      drawRoads();
      drawVehicles();
      drawEnemies();
      drawBullets();
      drawPlayer();
      drawMiniMap();
    }

    function gameLoop(timestamp) {
      const dt = Math.min((timestamp - state.lastTime) / 1000 || 0.016, 0.032);
      state.lastTime = timestamp;

      updatePlayer(dt);
      updateEnemies(dt);
      updateBullets(dt);
      updateHUD();
      render();

      requestAnimationFrame(gameLoop);
    }

    window.addEventListener('keydown', (e) => {
      state.keys[e.code] = true;
      if (e.code === 'KeyM') {
        state.mapIndex = (state.mapIndex + 1) % cityMaps.length;
        initMap();
      }
      if (e.code === 'KeyP') {
        state.wanted = (state.wanted + 1) % 6;
      }
      if (e.code === 'KeyF') {
        shootBullet();
      }
    });

    window.addEventListener('keyup', (e) => {
      state.keys[e.code] = false;
    });

    window.addEventListener('pointerdown', () => {
      shootBullet();
    });

    document.getElementById('quality').addEventListener('change', (e) => {
      state.quality = e.target.value;
      const alpha = { low: 0.35, medium: 0.5, high: 0.7 }[state.quality];
      document.body.style.filter = `saturate(${alpha + 0.8})`;
    });

    document.getElementById('soundToggle').addEventListener('change', (e) => {
      state.soundEnabled = e.target.checked;
    });

    document.querySelectorAll('.touchBtn').forEach((btn) => {
      const action = btn.dataset.action;
      btn.addEventListener('pointerdown', () => {
        if (action === 'left') state.keys['KeyA'] = true;
        if (action === 'right') state.keys['KeyD'] = true;
        if (action === 'accelerate') state.keys['KeyW'] = true;
        if (action === 'brake') state.keys['KeyS'] = true;
        if (action === 'fire') shootBullet();
      });
      btn.addEventListener('pointerup', () => {
        if (action === 'left') state.keys['KeyA'] = false;
        if (action === 'right') state.keys['KeyD'] = false;
        if (action === 'accelerate') state.keys['KeyW'] = false;
        if (action === 'brake') state.keys['KeyS'] = false;
      });
    });

    resize();
    initMap();
    requestAnimationFrame(gameLoop);
    window.addEventListener('resize', resize);
  </script>
</body>
</html>
